name: Tagged Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - uses: actions/checkout@v5
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - run: npm i
      - run: npm run lint
      - name: Build all targets
        run: node scripts/build.mjs --pack

      - name: Sign Firefox extension
        run: npx web-ext sign --source-dir anki-jpdb.reader --artifacts-dir packages --channel unlisted --api-key "$JWT_ISSUER" --api-secret "$JWT_SECRET"
        env:
          JWT_ISSUER: ${{ secrets.JWT_ISSUER }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}

      - name: Rename signed XPI to predictable filename
        run: |
          signed=$(find packages -name "*.xpi" ! -name "anki-jpdb.reader-*" | head -1)
          mv "$signed" packages/anki-jpdb.reader-firefox-signed.xpi

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            packages/anki-jpdb.reader-chromium.zip
            packages/anki-jpdb.reader-firefox.xpi
            packages/anki-jpdb.reader-firefox-signed.xpi
            packages/LICENSE.md
